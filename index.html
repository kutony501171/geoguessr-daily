<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoGuessr Daily Challenge 紀錄</title>
<script src="config.js"></script>
<script src="data.js"></script>
<style>
  :root{--bg:#0f1720;--panel:#16212d;--line:#263546;--text:#e6edf3;--muted:#8aa0b4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  #app{display:flex;height:100%}
  #side{width:340px;min-width:280px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  header{padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0 0 6px}
  .stats{display:flex;gap:12px;font-size:12px;color:var(--muted)}
  .stats b{color:var(--text);font-size:15px}
  .tools{padding:10px 16px;display:flex;gap:8px}
  .tools input,.tools select{flex:1;min-width:0;background:#0d151d;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
  .chk{padding:0 16px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
  #list{overflow-y:auto;flex:1;padding:8px}
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .day-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;background:#1b2836}
  .day-h:hover{background:#213144}
  .day-h .d{font-weight:600;white-space:nowrap;margin-right:8px}
  .s{font-size:12px;color:var(--muted)}
  .rounds{display:none}
  .day.open .rounds{display:block}
  .rd{display:flex;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);cursor:pointer}
  .rd:hover,.rd.active{background:#203041}
  .dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .rd .t{flex:1;min-width:0;font-size:14px}
  .rd .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mapWrap{flex:1;position:relative}
  #map{position:absolute;inset:0}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);z-index:5;text-align:center;line-height:1.8;color:var(--muted)}
  #err b{color:#ff8a80}
  /* 地圖上的編號圖釘 */
  .pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;
    align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);
    transform:translateY(50%);cursor:pointer;font-family:sans-serif}
  .pin.pic{border-color:#ffd54a;box-shadow:0 0 0 3px rgba(255,213,74,.45),0 1px 4px rgba(0,0,0,.6)}
  .pin.active{transform:translateY(50%) scale(1.3)}
  /* 資訊視窗（Google InfoWindow） */
  .gm-style .gm-style-iw-c{padding:0!important;background:var(--panel)!important;border-radius:10px!important}
  .gm-style .gm-style-iw-d{overflow:auto!important;padding:0!important}
  .gm-style .gm-style-iw-tc::after{background:var(--panel)!important}
  .gm-style-iw-chr{position:absolute;right:0;top:0;z-index:2}
  .gm-style-iw-chr button span{background-color:#fff!important}
  .pp{width:360px;max-width:80vw;color:var(--text);font-family:inherit}
  .pp-img{display:block;width:100%;cursor:zoom-in;background:#0d151d}
  .pp-noimg{padding:28px 18px 18px;text-align:center;color:var(--muted);font-size:13px;background:#0d151d}
  .pp-b{padding:10px 12px 12px}
  .pp-t{font-weight:700;font-size:15px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .pp-clues{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55}
  .pp-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn{background:#223245;color:var(--text)!important;border:1px solid var(--line);border-radius:7px;
    padding:5px 9px;cursor:pointer;font-size:12px;text-decoration:none;display:inline-block;font-family:inherit}
  .btn:hover{background:#2b3f56}
  .pp-nav{display:flex;justify-content:space-between;margin-top:8px}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:3000;align-items:center;justify-content:center}
  #lb.show{display:flex}
  #lb img{max-width:96vw;max-height:90vh;border-radius:6px}
  #toggleSide{display:none;float:right}
  @media (max-width:760px){
    #app{flex-direction:column}
    #side{width:100%;min-width:0;height:38%;border-right:0;border-bottom:1px solid var(--line)}
    #side.collapsed{height:auto}
    #side.collapsed .tools,#side.collapsed .chk,#side.collapsed #list{display:none}
    #mapWrap{flex:1}
    #toggleSide{display:inline-block}
    .pp{width:min(78vw,300px)}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <button class="btn" id="toggleSide">收合</button>
      <h1>🌍 GeoGuessr Daily Challenge</h1>
      <div class="stats">
        <div><b id="stDays">0</b> 天</div><div><b id="stLocs">0</b> 地點</div>
        <div><b id="stCountries">0</b> 國家</div><div><b id="stPics">0</b> 有截圖</div>
      </div>
    </header>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋國家／地區／線索…">
      <select id="dateSel"><option value="">全部日期</option></select>
    </div>
    <label class="chk"><input type="checkbox" id="onlyPic"> 只顯示有截圖的地點</label>
    <div id="list"></div>
  </aside>
  <div id="mapWrap"><div id="map"></div><div id="err"></div></div>
</div>
<div id="lb"><img alt=""></div>

<script>
const COLORS=["#e74c3c","#f39c12","#2ecc71","#3498db","#9b59b6"];
const color=r=>COLORS[(r-1)%5];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=l=>`${l.date}#${l.round}`;

const days=(typeof DAYS!=="undefined"?DAYS:[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
const allLocs=[];
days.forEach(d=>(d.rounds||[]).slice().sort((a,b)=>a.round-b.round)
  .forEach(r=>allLocs.push({...r,date:d.date,clues:r.clues||[],images:r.images||[]})));

/* ---------- 錯誤顯示 ---------- */
function showErr(msg){
  const e=document.getElementById("err");
  e.innerHTML=msg; e.style.display="flex";
}
window.gm_authFailure=()=>showErr(
  `<div><b>Google 地圖金鑰驗證失敗</b><br>
   請確認：① 已啟用 Maps JavaScript API ② 已綁定付款帳戶<br>
   ③ 金鑰的「網站限制」包含目前網址：<br><code>${esc(location.origin)}/*</code></div>`);
if(location.protocol==="file:"){
  console.warn("以本機檔案開啟：若金鑰有網站限制，地圖將無法載入。");
}

/* ---------- 載入 Google Maps（官方動態載入程式） ---------- */
(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
  key:CONFIG.API_KEY, v:"weekly", language:"zh-TW", region:"TW"
});

let map,info,svService,visible=[],current=null;

async function init(){
  const {Map,InfoWindow}=await google.maps.importLibrary("maps");
  const {AdvancedMarkerElement}=await google.maps.importLibrary("marker");
  const {StreetViewService}=await google.maps.importLibrary("streetView");
  window.AME=AdvancedMarkerElement;

  map=new Map(document.getElementById("map"),{
    center:{lat:20,lng:0}, zoom:2, mapId:CONFIG.MAP_ID,
    mapTypeId:"hybrid",                       // 預設衛星+路名
    mapTypeControl:true,
    mapTypeControlOptions:{mapTypeIds:["roadmap","terrain","satellite","hybrid"]},
    streetViewControl:true, fullscreenControl:true, gestureHandling:"greedy"
  });
  info=new InfoWindow({maxWidth:400});
  info.addListener("closeclick",()=>{current=null;markActive();});
  svService=new StreetViewService();
  render();
}
init().catch(e=>showErr(`<div><b>Google 地圖載入失敗</b><br>${esc(e.message)}</div>`));

/* ---------- 資訊視窗內容 ---------- */
function popupHtml(l){
  const ll=`${l.lat},${l.lng}`;
  const img=l.images.length
    ? l.images.map((s,i)=>`<img class="pp-img" src="${esc(s)}" data-src="${esc(s)}" alt="線索截圖${i+1}">`).join("")
    : `<div class="pp-noimg">尚無截圖</div>`;
  return `<div class="pp">${img}<div class="pp-b">
    <div class="pp-t"><span class="dot" style="background:${color(l.round)}">${l.round}</span>${esc(l.country)}</div>
    <div class="s">${esc(l.region)}｜${esc(l.date)} 第 ${l.round} 題</div>
    ${l.clues.length?`<ul class="pp-clues">${l.clues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
    <div class="pp-links">
      <button class="btn" data-act="sv">🚶 在地圖內看街景</button>
      <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}">↗ 新分頁街景</a>
    </div>
    <div class="pp-nav"><button class="btn" data-step="-1">◀ 上一個</button><button class="btn" data-step="1">下一個 ▶</button></div>
  </div></div>`;
}

/* ---------- 篩選與繪製 ---------- */
const q=document.getElementById("q"),dateSel=document.getElementById("dateSel"),onlyPic=document.getElementById("onlyPic");
days.forEach(d=>dateSel.insertAdjacentHTML("beforeend",`<option value="${esc(d.date)}">${esc(d.date)}</option>`));
function matches(l){
  if(dateSel.value&&l.date!==dateSel.value)return false;
  if(onlyPic.checked&&!l.images.length)return false;
  const kw=q.value.trim().toLowerCase();
  return !kw||[l.country,l.region,l.date,...l.clues].join(" ").toLowerCase().includes(kw);
}
function render(){
  visible=allLocs.filter(matches);
  if(map){
    allLocs.forEach(l=>{ if(l._m) l._m.map=null; });
    info.close(); current=null;
    const bounds=new google.maps.LatLngBounds();
    visible.forEach(l=>{
      if(!l._m){
        const el=document.createElement("div");
        el.className="pin"+(l.images.length?" pic":"");
        el.style.background=color(l.round); el.textContent=l.round;
        l._el=el;
        l._m=new AME({position:{lat:l.lat,lng:l.lng},content:el,
          title:`${l.date} 第${l.round}題｜${l.country}`,gmpClickable:true});
        l._m.addEventListener("gmp-click",()=>openInfo(l));
      }
      l._m.map=map; bounds.extend({lat:l.lat,lng:l.lng});
    });
    if(visible.length===1){map.setCenter(bounds.getCenter());map.setZoom(6);}
    else if(visible.length){map.fitBounds(bounds,40); google.maps.event.addListenerOnce(map,"idle",()=>{if(map.getZoom()>6)map.setZoom(6);});}
  }
  renderList();
  document.getElementById("stDays").textContent=days.length;
  document.getElementById("stLocs").textContent=allLocs.length;
  document.getElementById("stCountries").textContent=new Set(allLocs.map(l=>l.country)).size;
  document.getElementById("stPics").textContent=allLocs.filter(l=>l.images.length).length;
}
function renderList(){
  const list=document.getElementById("list");
  if(!visible.length){list.innerHTML=`<div class="s" style="text-align:center;padding:30px">沒有符合條件的地點</div>`;return;}
  const by={}; visible.forEach(l=>(by[l.date]||=[]).push(l));
  const openAll=!!(dateSel.value||q.value.trim()||onlyPic.checked);
  list.innerHTML=Object.keys(by).sort().reverse().map((d,i)=>`
    <div class="day ${openAll||i===0?"open":""}">
      <div class="day-h"><span class="d">${esc(d)}</span><span class="s">${by[d].map(l=>esc(l.country)).join("、")}</span></div>
      <div class="rounds">${by[d].map(l=>`
        <div class="rd" data-k="${esc(key(l))}">
          <div class="dot" style="background:${color(l.round)}">${l.round}</div>
          <div class="t">${esc(l.country)}<small>${esc(l.clues[0]||l.region)}</small></div>
          ${l.images.length?"📷":""}
        </div>`).join("")}</div></div>`).join("");
  list.querySelectorAll(".day-h").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  list.querySelectorAll(".rd").forEach(r=>r.onclick=()=>go(visible.find(x=>key(x)===r.dataset.k)));
  markActive();
}
function markActive(){
  document.querySelectorAll(".rd").forEach(r=>r.classList.toggle("active",!!current&&r.dataset.k===key(current)));
  allLocs.forEach(l=>l._el&&l._el.classList.toggle("active",l===current));
}

function openInfo(l){
  if(!map)return;
  current=l;
  map.getStreetView().setVisible(false);
  info.setContent(popupHtml(l));
  info.open({map,anchor:l._m});
  markActive();
}
function go(l){
  if(!l||!map)return;
  map.panTo({lat:l.lat,lng:l.lng});
  if(map.getZoom()<5)map.setZoom(5);
  openInfo(l);
}

/* 在地圖內開啟最近的街景 */
function openStreetView(l){
  svService.getPanorama({location:{lat:l.lat,lng:l.lng},radius:200,
      preference:google.maps.StreetViewPreference.NEAREST},(data,status)=>{
    if(status==="OK"){
      const sv=map.getStreetView();
      sv.setPano(data.location.pano); sv.setPov({heading:0,pitch:0}); sv.setVisible(true);
      info.close();
    } else alert("這個座標附近 200 公尺內找不到 Google 街景。");
  });
}

/* 資訊視窗內按鈕、圖片放大 */
document.addEventListener("click",e=>{
  const im=e.target.closest(".pp-img");
  if(im){lb.querySelector("img").src=im.dataset.src;lb.classList.add("show");return;}
  const st=e.target.closest("[data-step]");
  if(st&&current){const i=visible.indexOf(current);go(visible[(i+ +st.dataset.step+visible.length)%visible.length]);return;}
  if(e.target.closest("[data-act='sv']")&&current) openStreetView(current);
});
const lb=document.getElementById("lb");
lb.onclick=()=>lb.classList.remove("show");
document.addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("show");});

document.getElementById("toggleSide").onclick=e=>{
  const s=document.getElementById("side");s.classList.toggle("collapsed");
  e.target.textContent=s.classList.contains("collapsed")?"展開":"收合";
};
q.oninput=render; dateSel.onchange=render; onlyPic.onchange=render;
render();  // 先畫清單，地圖載入後會再畫一次
</script>
</body>
</html>
